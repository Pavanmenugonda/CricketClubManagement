<div class="login-page">
  <div class="login-card">

    <h1 class="title">Cricket Club Management</h1>
    <p class="subtitle">Sign in to continue</p>

    <form (ngSubmit)="login()" novalidate>

      <div class="field">
        <label>Username</label>
        <input type="text"
               [(ngModel)]="username"
               name="username"
               required
               placeholder="Enter your username" />
      </div>

      <div class="field">
        <label>Password</label>
        <input type="password"
               [(ngModel)]="password"
               name="password"
               required
               placeholder="••••••••••••••••••" />
      </div>

      <button type="submit" class="login-btn">
        Login
      </button>

    </form>

    @if (error) {
    <div class="error">
      {{ error }}
    </div>
    }

  </div>
</div>
