<div class="row">
  <div class="col-md-4 offset-md-4 col-sm-6 offset-sm-3">
    <div class="card auth">
      <div class="card-body auth-card">
        <div class="login-container">
          <form (ngSubmit)="login()">
            <div class="form-group">
              <label for="email">Username : </label>
              <input [(ngModel)]="username" name="username" required class="form-control" />
            </div>
            <div class="form-group">
              <label for="password">Password : </label>
              <input type="password" [(ngModel)]="password" class="form-control" name="password" required placeholder="********" />
            </div>
            <div class="text-center">
              <input type="submit" class="btn btn-my" value="Login">
            </div>
          </form>
          @if (error) {
          <div class="error">{{ error }}</div>
          }
        </div>
      </div>
    </div>
  </div>
</div>
